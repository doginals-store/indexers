[workspace]
members = [
  ".",
  "crates/core",
  "crates/indexer",
  "crates/dproto",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
# Storage engine: an LSM tree suits this write-heavy, append-mostly workload.
rocksdb = "0.22"
# Persistent work-stealing pool for the per-block prepare phase.
rayon = "1"
bincode = "1"
hex = "0.4"
once_cell = "1"

[package]
name = "doginals-indexer"
description = "Dogecoin indexers: Doginals inscriptions, DRC-20, Dunes, Dogemaps and DNS names"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dogeord-core = { path = "crates/core" }
dogeord-indexer = { path = "crates/indexer" }
